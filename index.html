<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>台山市鹏权中学 · 校园三维模型</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ee; font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; color: #fff;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { background: rgba(18, 28, 40, .62); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .14); border-radius: 10px; }
  #topbar { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
  #topbar > * { pointer-events: auto; }
  #hud { padding: 10px 12px; }
  #hud h1 { margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  #hud h1 small { font-weight: 400; font-size: 12px; opacity: .75; margin-left: 6px; }
  button, select { font: inherit; font-size: 13px; color: #fff; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22); border-radius: 7px; padding: 6px 12px; cursor: pointer; outline: none; }
  button:hover, select:hover { background: rgba(255, 255, 255, .2); }
  button.on { background: #2f7de1; border-color: #6aa6f2; }
  select option { color: #111; }
  #modes { display: flex; gap: 6px; flex-wrap: wrap; }
  #tgTools { display: none; }
  #tools { padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 62vw; justify-content: flex-end; font-size: 13px; }
  #tools input[type=range] { width: 120px; vertical-align: middle; }
  #help { position: fixed; left: 12px; bottom: 12px; padding: 7px 12px; font-size: 12.5px; max-width: calc(100vw - 330px); line-height: 1.5; transition: opacity .6s; pointer-events: none; }
  #help.fade { opacity: 0; }
  #miniWrap { position: fixed; right: 12px; bottom: 12px; padding: 5px; line-height: 0; z-index: 3; }
  #mini { width: 264px; height: 216px; border-radius: 6px; cursor: crosshair; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -4px 0 0 -4px; border: 1px solid rgba(255, 255, 255, .9); border-radius: 50%; display: none; pointer-events: none; box-shadow: 0 0 2px #000; }
  #lock { position: fixed; left: 50%; top: 62%; transform: translateX(-50%); padding: 8px 16px; font-size: 14px; display: none; pointer-events: none; }
  #loading { position: fixed; inset: 0; background: linear-gradient(#274a78, #7fa8cf); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #loading .box { text-align: center; }
  #loading h1 { font-size: 30px; letter-spacing: 6px; margin: 0 0 6px; font-family: "KaiTi", "STKaiti", "楷体", serif; }
  #loading p { margin: 6px 0; opacity: .9; }

  /* 触屏第一人称：左下虚拟摇杆 + 右下按钮（仅触屏且第一人称时显示） */
  #touchUI { display: none; }
  body.touch.fp #touchUI { display: block; }
  #joy { position: fixed; left: calc(22px + env(safe-area-inset-left)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%;
    background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .38); touch-action: none; z-index: 4; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255, 255, 255, .5); pointer-events: none; }
  .tbtn { position: fixed; border-radius: 50%; padding: 0; background: rgba(255, 255, 255, .16); border: 2px solid rgba(255, 255, 255, .42); touch-action: none; z-index: 4; }
  .tbtn.on { background: rgba(47, 125, 225, .8); }
  #tJump { right: calc(24px + env(safe-area-inset-right)); bottom: calc(38px + env(safe-area-inset-bottom)); width: 78px; height: 78px; font-size: 19px; }
  #tDown { right: calc(32px + env(safe-area-inset-right)); bottom: calc(130px + env(safe-area-inset-bottom)); width: 62px; height: 62px; font-size: 17px; display: none; }
  body.fly #tDown { display: block; }
  #tFly { right: calc(116px + env(safe-area-inset-right)); bottom: calc(38px + env(safe-area-inset-bottom)); width: 58px; height: 58px; font-size: 12px; }

  /* 小屏幕（手机横竖屏）：标题收起，工具收进“设置”按钮，小地图缩小并移到右上 */
  @media (max-width: 820px), (max-height: 560px) {
    #topbar { left: 8px; top: 8px; right: 8px; flex-direction: column; justify-content: flex-start; gap: 6px; }
    #hud { padding: 6px 8px; }
    #hud h1 { display: none; }
    button, select { font-size: 12px; padding: 6px 9px; }
    #tgTools { display: inline-block; }
    #tools { display: none; max-width: calc(100vw - 168px); justify-content: flex-start; padding: 8px; }
    #tools.open { display: flex; }
    #tools input[type=range] { width: 96px; }
    #miniWrap { top: 56px; right: 8px; bottom: auto; padding: 3px; }
    #mini { width: 132px; height: 108px; }
    #help { left: 50%; transform: translateX(-50%); bottom: 10px; max-width: 92vw; font-size: 11.5px; text-align: center; padding: 5px 10px; }
    #loading h1 { font-size: 22px; letter-spacing: 3px; }
  }
  body.touch.fp #help { left: 8px; top: 56px; bottom: auto; transform: none; text-align: left; max-width: calc(100vw - 168px); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="topbar">
  <div id="hud" class="panel">
    <h1>台山市鹏权中学<small>校园三维模型</small></h1>
    <div id="modes">
      <button data-mode="top">① 俯视</button>
      <button data-mode="bird">② 鸟瞰</button>
      <button data-mode="fp">③ 第一人称</button>
      <button id="tgTools">设置</button>
    </div>
  </div>
  <div id="tools" class="panel">
    <span>时间 <input id="time" type="range" min="6.5" max="18" step="0.25" value="9"> <b id="timeV">9:00</b></span>
    <select id="spots"><option value="">快速定位…</option></select>
    <button id="tgMini" class="on">小地图</button>
    <button id="bReset">复位</button>
  </div>
</div>
<div id="help" class="panel"></div>
<div id="miniWrap" class="panel"><canvas id="mini" width="264" height="216"></canvas></div>
<div id="cross"></div>
<div id="lock" class="panel">点击画面开始漫游（Esc 释放鼠标）</div>
<div id="touchUI">
  <div id="joy"><div id="joyKnob"></div></div>
  <button id="tFly" class="tbtn">飞行</button>
  <button id="tDown" class="tbtn">降</button>
  <button id="tJump" class="tbtn">跳</button>
</div>
<div id="loading"><div class="box"><h1>台山市鹏权中学</h1><p>校园三维模型</p><p id="status">加载中…</p></div></div>
<script src="vendor/three.global.js"></script><!-- 本地 three.js r170；若缺失会自动改用 CDN -->
<script src="js/core.js"></script>
<script src="js/campus.js"></script>
<script src="js/app.js"></script>
</body>
</html>
